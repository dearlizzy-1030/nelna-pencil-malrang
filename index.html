<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>낼나펜슬 말랑이 | 꾹 눌러서 말랑말랑 만져보는 3D ASMR</title>
<meta name="description" content="낼나 펜슬을 꾹 눌러서 말랑말랑 만져보는 3D ASMR. 이어폰으로 들어보세요.">
<meta property="og:title" content="낼나펜슬 말랑이">
<meta property="og:description" content="꾹 눌러서 말랑말랑. 낼나펜슬 말랑이 ASMR">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--green:#2E5E4E;--green-d:#1f4036;--cream:#FEF8F0;--yellow:#F8CF77;--sage:#E7F1DF;--char:#262929}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--char);
  background:radial-gradient(120% 90% at 50% 18%,#FFFDF8 0%,var(--cream) 45%,var(--sage) 100%);user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

.iconbtn{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;z-index:5;border:0;background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);width:38px;height:38px;border-radius:50%;font-size:17px;box-shadow:0 2px 8px rgba(46,94,78,.15);cursor:pointer}

#title{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:opacity .4s}
#title .head{padding-top:calc(env(safe-area-inset-top) + 34px);text-align:center}
#title img.logo{height:44px;display:block;margin:0 auto 10px}
#title h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-1.2px;color:var(--green)}
#title p{margin:8px 0 12px;font-size:14px;color:#5b6b63;font-weight:500}
.chip{display:inline-block;background:rgba(46,94,78,.9);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}
#title .foot{margin-top:auto;width:100%;max-width:520px;padding:0 20px calc(env(safe-area-inset-bottom) + 26px);pointer-events:auto}
.hide{opacity:0;pointer-events:none!important}
.hide *{pointer-events:none!important}

.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:999px;height:50px;padding:0 20px;font-size:16px;
  transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{width:100%;background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid rgba(46,94,78,.25);height:44px;font-size:14px;font-weight:700}
.btn.ghost:active{background:var(--sage)}

.panel{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;transform:translate(-50%,115%);
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);background:rgba(255,255,255,.86);backdrop-filter:blur(16px);
  border-radius:26px 26px 0 0;box-shadow:0 -10px 34px rgba(46,94,78,.14);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.panel.show{transform:translate(-50%,0)}
.pt{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin-bottom:12px}
.pt b{color:var(--green);font-size:15px}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

.spin{position:fixed;top:42%;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--green);font-size:16px;
  box-shadow:0 2px 10px rgba(46,94,78,.18);cursor:pointer;transition:opacity .3s;z-index:3}
#spinL{left:12px}#spinR{right:12px}

#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-10px);background:rgba(38,41,41,.88);color:#fff;font-size:13px;font-weight:600;
  padding:9px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;width:max-content;max-width:88vw;text-align:center;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--cream);font-weight:800;color:var(--green);z-index:20;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">낼나 연필 깎는 중…</div>
<button class="iconbtn" id="soundBtn" aria-label="소리 켜기/끄기">🔊</button>
<button class="spin hide" id="spinL" aria-label="왼쪽으로 돌리기">◀</button>
<button class="spin hide" id="spinR" aria-label="오른쪽으로 돌리기">▶</button>

<section id="title">
  <div class="head">
    <img class="logo" id="titleLogo" alt="nelna.">
    <h1>낼나펜슬 말랑이</h1>
    <p>낼나 펜슬을 꾹 눌러서 말랑 말랑 만져보세요</p>
    <span class="chip">🎧 이어폰으로 들으면 더 시원해요</span>
  </div>
  <div class="foot"><button class="btn primary" id="startBtn">만져보기</button></div>
</section>

<section class="panel" id="pp">
  <div class="pt"><span id="hintTxt">🤏 꾹 눌렀다가, 쓱 주물러보세요</span><span>말랑 <b id="cnt">0</b>번</span></div>
  <div class="btnrow">
    <button class="btn ghost" id="saveBtn">📷 이미지 저장</button>
    <a class="btn ghost" id="shopLink" href="https://nelna.shop" target="_blank" rel="noopener">낼나샵 구경하기</a>
  </div>
</section>
<div id="toast"></div>

  setOn(v){S.sound=v; if(this.master)this.master.gain.value=v?.9:0;},
  burst(t,power,fMin,fMax,len){ // 아주 짧은 잡음 한 번 = 기포 하나
    const c=this.ctx,src=c.createBufferSource();src.buffer=this.noise;src.playbackRate.value=.8+Math.random()*.7;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fMin+Math.random()*(fMax-fMin);bp.Q.value=1.5+Math.random()*2;
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(power,t+.002);g.gain.exponentialRampToValueAtTime(.001,t+len);

  },

    const c=this.ctx,t=c.currentTime+(delay||0),src=c.createBufferSource();src.buffer=this.noise;src.playbackRate.value=.8+Math.random()*.4;

  },
  cells(n,span,gain,fMin,fMax){ // 스펀지 속 작은 기포 터짐

const prof=[];{
  const add=(r,y,sec)=>prof.push({r,y,sec});
  for(let i=0;i<=24;i++){const a=i/24*PI/2;add(.955*Math.sin(a),.55*(1-Math.cos(a)),'eraser');}
  for(let i=1;i<=48;i++){const t=i/48;add(.955+.065*(.5-.5*Math.cos(t*PI*2*4)),.55+.75*t,'ferrule');}
  for(let i=1;i<=44;i++)add(.98,1.3+(3.65-1.3)*i/44,'body');
  for(let i=1;i<=16;i++){const a=i/16*PI/2;add(.83+.15*Math.cos(a),3.65+.30*Math.sin(a),'body');}
  for(let i=1;i<=24;i++){const t=i/24;add(.83-.45*t+.03*Math.sin(PI*t),3.95+.75*t,'cone');}
  for(let i=1;i<=16;i++){const a=i/16*PI/2;add(.38*Math.cos(a),4.7+.42*Math.sin(a),'tip');}
}
const H=prof[prof.length-1].y,HC=H/2;
prof.forEach((p,i)=>{
  const a=prof[Math.max(0,i-1)],b=prof[Math.min(prof.length-1,i+1)],tr=b.r-a.r,ty=b.y-a.y,l=Math.hypot(tr,ty)||1;p.nr=ty/l;p.ny=-tr/l;
});
prof[0].nr=0;prof[0].ny=-1;prof[prof.length-1].nr=0;prof[prof.length-1].ny=1;
const secRange=n=>{const f=prof.findIndex(p=>p.sec===n),l=prof.map(p=>p.sec).lastIndexOf(n);return[Math.max(0,f-1),l];};
function revolve(i0,i1,seg,uvFn){
  const pos=[],nor=[],uv=[],idx=[];
  for(let i=i0;i<=i1;i++)for(let j=0;j<=seg;j++){
    const th=j/seg*PI*2,s=Math.sin(th),c=Math.cos(th),P=prof[i];
    pos.push(-P.r*s,P.y-HC,-P.r*c);nor.push(-P.nr*s,P.ny,-P.nr*c);uv.push(j/seg,uvFn(P));
  }
  const row=seg+1;
  for(let i=0;i<i1-i0;i++)for(let j=0;j<seg;j++){const a=i*row+j,b=a+1,c=a+row,d=c+1;idx.push(a,b,c,b,d,c);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);return g;
}

/* 말랑이 변형: 손가락이 누른 자리가 넓고 부드럽게 눌리고, 둘레가 부풀고, 문지르면 반죽처럼 끌려가요 (GPU 계산) */
const NDENT=6,SQ_R=.76,SQ_MAX=.44;
const sqP=Array.from({length:NDENT},()=>new THREE.Vector4(0,0,0,0));   // xyz 눌린 중심, w 깊이
const sqD=Array.from({length:NDENT},()=>new THREE.Vector4(0,0,0,0));   // xyz 누르는 방향
const sqS=Array.from({length:NDENT},()=>new THREE.Vector4(0,0,0,0));   // xyz 끌림(쉬어)
Object.values(mats).forEach(m=>{
  m.onBeforeCompile=sh=>{
    sh.uniforms.uSqP={value:sqP};sh.uniforms.uSqD={value:sqD};sh.uniforms.uSqS={value:sqS};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
        uniform vec4 uSqP[${NDENT}];uniform vec4 uSqD[${NDENT}];uniform vec4 uSqS[${NDENT}];
        vec3 squishDisp(vec3 pp,vec3 nn){
          vec3 d=vec3(0.0);
          for(int i=0;i<${NDENT};i++){
            float dp=uSqP[i].w;
            if(dp>0.0005){
              vec3 dir=uSqD[i].xyz; vec3 v=pp-uSqP[i].xyz;
              float al=dot(v,dir); vec3 lat=v-dir*al; float r=length(lat);
              float R=${SQ_R.toFixed(3)};
              float w=exp(-(r*r)/(R*R)*1.3);
              float front=smoothstep(-0.2,0.6,-dot(nn,dir));
              d+=dir*dp*w*front;                                   // 손가락 쪽이 쑥 눌림
              d+=uSqS[i].xyz*w*front;                              // 문지르면 끌려감
              if(r>0.0001) d+=(lat/r)*dp*0.46*(r/R)*exp(-(r*r)/(R*R)*0.9); // 눌린 만큼 둘레로 부풀음
            }
          }
          return d;
        }`)
      .replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
        vec3 sqn=normalize(normal);
        vec3 sqh=abs(sqn.y)>0.9?vec3(1.0,0.0,0.0):vec3(0.0,1.0,0.0);
        vec3 sqt1=normalize(cross(sqn,sqh)); vec3 sqt2=cross(sqn,sqt1);
        float sqe=0.03;
        vec3 sqd0=squishDisp(position,sqn);
        vec3 sqe1=sqt1*sqe+(squishDisp(position+sqt1*sqe,sqn)-sqd0);
        vec3 sqe2=sqt2*sqe+(squishDisp(position+sqt2*sqe,sqn)-sqd0);
        vec3 sqnn=normalize(cross(sqe1,sqe2)); if(dot(sqnn,sqn)<0.0) sqnn=-sqnn;
        objectNormal=sqnn;`)
      .replace('#include <begin_vertex>','#include <begin_vertex>\n transformed += sqd0;');
  };
});

  cur.panelH+=((S.stage==='title'?130:cur.target)-cur.panelH)*k;
  cur.topPad+=((S.stage==='title'?200:54)-cur.topPad)*k;

  if(!(ptr.down&&ptr.mode==='spin')){rotY+=spinV*dt;spinV*=Math.exp(-dt*2.6);}
  if(S.stage==='title')rotY+=.5*dt;
  if(settle&&Math.abs(spinV)<.05)rotY+=(0-rotY)*(1-Math.exp(-dt*3));

  // 전체 눌림: 튕기지 않고 부드럽게 들어갔다 천천히 돌아옴
  sq.x+=((sq.pressed?1:0)-sq.x)*(1-Math.exp(-dt*(sq.pressed?9:3.5)));
  const sy=1-.04*sq.x,sxz=1+.02*sq.x;
  pencil.scale.set(sxz,sy,sxz);
  pencil.position.set(0,-HC*(1-sy)+(S.stage==='title'?Math.sin(tAll*1.6)*.07:0),0);
  pencil.rotation.set(0,rotY,S.stage==='title'?Math.sin(tAll*1.1)*.05:0);
  shadow.scale.set(1.9*(1+.05*sq.x),1.9*(1+.05*sq.x),1);

  // 말랑이 변형: 누르는 동안 부드럽게 깊어지고, 놓으면 쫀득하게 천천히 올라와요 (튕김 없음)
  for(let i=dents.length-1;i>=0;i--){
    const d=dents[i];
    d.q.lerp(d.p,1-Math.exp(-dt*8));                         // 누른 자리가 손가락을 살짝 늦게 따라감 = 끌리는 느낌
    if(d.held)d.e+=(SQ_MAX-d.e)*(1-Math.exp(-dt*5.5));
    else d.e*=Math.exp(-dt*2.2);
    if(!d.held&&d.e<.004){dents.splice(i,1);if(heldDent===d)heldDent=null;}
  }
  for(let i=0;i<NDENT;i++){
    const d=dents[i];
    if(d){sqP[i].set(d.q.x,d.q.y,d.q.z,d.e);sqD[i].set(d.dir.x,d.dir.y,d.dir.z,0);
      const k=d.e/SQ_MAX*.62;sqS[i].set((d.p.x-d.q.x)*k,(d.p.y-d.q.y)*k,(d.p.z-d.q.z)*k,0);}
    else sqP[i].set(0,0,0,0);
  }

  updateCamera();renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
$('#loading').style.opacity=0;setTimeout(()=>$('#loading').remove(),600);
go('title');
requestAnimationFrame(frame);
window.waxball={S,go,dents,setRot:v=>{rotY=v;spinV=0;settle=false;}};
})();
</script>
</body>
